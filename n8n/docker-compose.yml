services:
  n8n-postgres:
    image: postgres:16-alpine
    container_name: agent-n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    networks:
      - agent_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U n8n -d n8n']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.omer.project: agent-icerik
      com.omer.env: prod
      com.omer.role: db

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: agent-libretranslate
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: tr,en
    ports:
      - '127.0.0.1:5000:5000'
    networks:
      - agent_internal
    # Internal only — n8n reaches via http://libretranslate:5000
    labels:
      com.omer.project: agent-icerik
      com.omer.env: prod
      com.omer.role: translate

  n8n:
    image: n8nio/n8n:latest
    container_name: agent-n8n
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      # n8n 2.x default excludes executeCommand; Telegram Abonelik Yakala needs it.
      NODES_EXCLUDE: '["n8n-nodes-base.localFileTrigger"]'
      N8N_PORT: '5678'
      N8N_PROXY_HOPS: '1'
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '336'
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/site;/home/node/.n8n-files;/home/node/data
      # Allow Code nodes: fs for posts/queue; path optional (prefer string join)
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path
      DEPLOY_LISTENER_TOKEN: ${DEPLOY_LISTENER_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - /root/agent-icerik-sistemi/n8n/data:/home/node/data:rw
      - /root/agent-icerik-sistemi/site:/home/node/site:rw
      - /root/agent-icerik-sistemi/scripts:/home/node/scripts:ro
    networks:
      - agent_internal
      - ops_net
    labels:
      com.omer.project: agent-icerik
      com.omer.env: prod
      com.omer.role: app
      com.omer.backup.volumes: n8n_n8n_data

networks:
  agent_internal:
    name: n8n_agent_internal
  ops_net:
    external: true

volumes:
  n8n_data:
    name: n8n_n8n_data
  n8n_postgres_data:
    name: n8n_n8n_postgres_data
