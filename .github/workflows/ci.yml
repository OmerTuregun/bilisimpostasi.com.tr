name: Site CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: site

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      # Generated posts live only on the VDS (gitignored). Seed one TR/EN fixture
      # so `astro build && pagefind` can succeed in CI without real content.
      - name: Seed fixture posts for CI build
        run: |
          mkdir -p src/content/posts/tr src/content/posts/en
          cat > src/content/posts/tr/ci-fixture-20260101-000000.md <<'EOF'
          ---
          title: CI Fixture
          pubDate: 2026-01-01T00:00:00.000Z
          description: Fixture post so CI can build while real posts stay off git.
          kaynak: https://example.com/ci-fixture
          kategori: Donanım & Çipler
          tags: [ci]
          tagLabels:
            ci: { tr: CI, en: CI }
          ---
          CI fixture body.
          EOF
          cat > src/content/posts/en/ci-fixture-20260101-000000.md <<'EOF'
          ---
          title: CI Fixture
          pubDate: 2026-01-01T00:00:00.000Z
          description: Fixture post so CI can build while real posts stay off git.
          kaynak: https://example.com/ci-fixture
          kategori: Hardware & Chips
          tags: [ci]
          tagLabels:
            ci: { tr: CI, en: CI }
          ---
          CI fixture body.
          EOF

      - name: Production build
        run: npm run build
        env:
          # Placeholders only — popular-posts skips live Umami when WEBSITE_ID is empty.
          # Real secrets are never used in CI; this job does not deploy.
          UMAMI_API_URL: http://127.0.0.1:3002
          UMAMI_WEBSITE_ID: ''
          UMAMI_API_TOKEN: ''
          UMAMI_USERNAME: ''
          UMAMI_PASSWORD: ''
