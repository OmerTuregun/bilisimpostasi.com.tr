name: Site CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: site

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Placeholders only — popular-posts skips live Umami when WEBSITE_ID is empty.
          # Real secrets are never used in CI; this job does not deploy.
          UMAMI_API_URL: http://127.0.0.1:3002
          UMAMI_WEBSITE_ID: ''
          UMAMI_API_TOKEN: ''
          UMAMI_USERNAME: ''
          UMAMI_PASSWORD: ''
